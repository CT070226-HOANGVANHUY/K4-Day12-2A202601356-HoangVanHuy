name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-dummy-token
      REDIS_URL: fake://
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag day12-chat:ci .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

      - name: Smoke test
        env:
          PUBLIC_URL: https://day12-chat-y28x.onrender.com
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$PUBLIC_URL/healthz"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
